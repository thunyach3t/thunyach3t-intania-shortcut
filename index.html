<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intania Shortcut Hub - Chula Engineering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
    .shake { animation: shake 0.3s infinite alternate; }
    @keyframes shake { 0% { transform: rotate(-1deg); } 100% { transform: rotate(1deg); } }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- Header Bar with Real Chula Engineering Logo Image -->
  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <!-- Logo Section -->
      <div class="flex items-center">
        <img src="https://reg.eng.chula.ac.th/reg/wp-content/uploads/2018/05/cropped-cu-eng-logo.png" alt="Chula Engineering Logo" class="h-10 sm:h-12 w-auto object-contain">
      </div>

      <!-- Action Buttons (+ / -) -->
      <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
        <button onclick="toggleDeleteMode()" id="deleteToggleBtn" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold border border-slate-300 transition flex items-center gap-1.5">
          <i class="fa-solid fa-minus"></i>
          <span id="deleteBtnText">โหมดลบเว็บ</span>
        </button>

        <button onclick="openModal()" class="px-4 py-2 rounded-xl bg-rose-900 hover:bg-rose-950 text-white text-xs font-bold shadow transition flex items-center gap-1.5">
          <i class="fa-solid fa-plus"></i>
          <span>เพิ่มทางลัด</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow space-y-6">

    <div id="storageWarning" class="hidden bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-xl text-xs flex items-center gap-2">
      <i class="fa-solid fa-triangle-exclamation text-amber-600"></i>
      <span>คำเตือน: เบราว์เซอร์ของคุณบล็อกการบันทึกข้อมูลถาวร (LocalStorage) กรุณาออกจากโหมดส่วนตัว (Incognito)</span>
    </div>

    <!-- Search Bar -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input type="text" id="searchInput" oninput="renderShortcuts()" placeholder="ค้นหาทางลัดเว็บไซต์..." 
             class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-rose-800 text-sm transition">
    </div>

    <!-- Multi-Select Category Filter Buttons -->
    <div class="flex flex-wrap justify-center gap-2" id="categoryFilterContainer">
      <button data-cat="all" onclick="toggleCategory('all')" class="cat-btn bg-slate-800 text-white px-4 py-1.5 rounded-full text-xs font-medium transition shadow-sm hover:opacity-90">
        🌟 ทั้งหมด
      </button>
      <button data-cat="fa-graduation-cap" onclick="toggleCategory('fa-graduation-cap')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-4 py-1.5 rounded-full text-xs font-medium transition shadow-sm hover:bg-slate-50">
        🎓 การเรียน / มหาวิทยาลัย
      </button>
      <button data-cat="fa-book" onclick="toggleCategory('fa-book')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-4 py-1.5 rounded-full text-xs font-medium transition shadow-sm hover:bg-slate-50">
        📚 หนังสือ / ห้องสมุด
      </button>
      <button data-cat="fa-envelope" onclick="toggleCategory('fa-envelope')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-4 py-1.5 rounded-full text-xs font-medium transition shadow-sm hover:bg-slate-50">
        📧 อีเมล / ติดต่อ
      </button>
      <button data-cat="fa-laptop-code" onclick="toggleCategory('fa-laptop-code')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-4 py-1.5 rounded-full text-xs font-medium transition shadow-sm hover:bg-slate-50">
        💻 ระบบการเรียนออนไลน์
      </button>
      <button data-cat="fa-globe" onclick="toggleCategory('fa-globe')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-4 py-1.5 rounded-full text-xs font-medium transition shadow-sm hover:bg-slate-50">
        🌐 เว็บทั่วไป
      </button>
      <button data-cat="fa-gamepad" onclick="toggleCategory('fa-gamepad')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-4 py-1.5 rounded-full text-xs font-medium transition shadow-sm hover:bg-slate-50">
        🎮 เว็บเกม
      </button>
    </div>

    <!-- Shortcuts Grid -->
    <div id="shortcutsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
      <!-- Shortcuts will be rendered here -->
    </div>

  </main>

  <!-- Add Shortcut Modal -->
  <div id="addModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
          <i class="fa-solid fa-link text-rose-800"></i> เพิ่มทางลัดใหม่
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form onsubmit="addShortcut(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อเว็บไซต์ / ระบบ</label>
          <input type="text" id="shortcutName" required placeholder="เช่น myCourseVille, Reg Chula" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-800">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">URL (ลิงก์เว็บไซต์)</label>
          <input type="url" id="shortcutUrl" required placeholder="https://www.example.com" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-800">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">เลือกไอคอน</label>
          <select id="shortcutIcon" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-800 bg-white">
            <option value="fa-graduation-cap">🎓 การเรียน / มหาวิทยาลัย</option>
            <option value="fa-book">📚 หนังสือ / ห้องสมุด</option>
            <option value="fa-envelope">✉️ อีเมล / ติดต่อ</option>
            <option value="fa-laptop-code">💻 ระบบการเรียนออนไลน์</option>
            <option value="fa-globe">🌐 เว็บทั่วไป</option>
            <option value="fa-gamepad">🎮 เว็บเกม</option>
          </select>
        </div>

        <button type="submit" class="w-full py-2.5 bg-rose-900 text-white font-semibold rounded-xl hover:bg-rose-950 transition text-sm shadow">
          บันทึกทางลัด
        </button>
      </form>
    </div>
  </div>

  <footer class="text-center py-4 text-xs text-slate-400 border-t bg-white mt-8">
    Intania Shortcut Hub &copy; คณะวิศวกรรมศาสตร์ จุฬาลงกรณ์มหาวิทยาลัย
  </footer>

  <script>
    const defaultPresets = [
      { id: '1', name: 'Reg Chula', url: 'https://www.reg.chula.ac.th', icon: 'fa-graduation-cap' },
      { id: '2', name: 'myCourseVille', url: 'https://www.mycourseville.com', icon: 'fa-laptop-code' },
      { id: '3', name: 'Office 365', url: 'https://www.office.com', icon: 'fa-envelope' },
      { id: '4', name: 'Chula Library', url: 'https://www.car.chula.ac.th', icon: 'fa-book' }
    ];

    let shortcuts = [];
    let isDeleteMode = false;
    
    // ใช้ Set ในการเก็บหลายหมวดหมู่พร้อมกัน
    let selectedCategories = new Set(['all']);

    function toggleCategory(category) {
      if (category === 'all') {
        // ถ้าคลิก "ทั้งหมด" ให้ล้างหมวดหมู่อื่นๆ แล้วเลือกแค่ 'all'
        selectedCategories.clear();
        selectedCategories.add('all');
      } else {
        // ถ้าเลือกหมวดหมู่อื่น ให้เอานำ 'all' ออก
        selectedCategories.delete('all');

        // สลับสถานะ (ถ้ามีแล้วให้ลบออก ถ้ายังไม่มีให้เพิ่มเข้าไป)
        if (selectedCategories.has(category)) {
          selectedCategories.delete(category);
        } else {
          selectedCategories.add(category);
        }

        // ถ้าผู้ใช้ยกเลิกทุกปุ่มจนไม่มีอะไรเลย ให้เด้งกลับไปเลือก 'all'
        if (selectedCategories.size === 0) {
          selectedCategories.add('all');
        }
      }

      updateCategoryButtonsUI();
      renderShortcuts();
    }

    function updateCategoryButtonsUI() {
      const buttons = document.querySelectorAll('.cat-btn');
      buttons.forEach(btn => {
        const cat = btn.getAttribute('data-cat');
        if (selectedCategories.has(cat)) {
          // สไตล์สำหรับปุ่มที่ถูกเลือก (Active)
          btn.className = 'cat-btn bg-slate-800 text-white px-4 py-1.5 rounded-full text-xs font-medium transition shadow-sm hover:opacity-90';
        } else {
          // สไตล์สำหรับปุ่มที่ไม่ได้เลือก (Inactive)
          btn.className = 'cat-btn bg-white text-slate-600 border border-slate-200 px-4 py-1.5 rounded-full text-xs font-medium transition shadow-sm hover:bg-slate-50';
        }
      });
    }

    function loadShortcuts() {
      try {
        const savedData = localStorage.getItem('intania_shortcuts_v1');
        if (savedData !== null) {
          shortcuts = JSON.parse(savedData);
        } else {
          shortcuts = defaultPresets;
          saveToLocalStorage();
        }
      } catch (e) {
        console.warn('LocalStorage error:', e);
        document.getElementById('storageWarning').classList.remove('hidden');
        shortcuts = defaultPresets;
      }
      renderShortcuts();
    }

    function saveToLocalStorage() {
      try {
        localStorage.setItem('intania_shortcuts_v1', JSON.stringify(shortcuts));
      } catch (e) {
        console.warn('Cannot save to LocalStorage:', e);
        document.getElementById('storageWarning').classList.remove('hidden');
      }
    }

    function renderShortcuts() {
      const grid = document.getElementById('shortcutsGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = shortcuts.filter(s => {
        const matchesSearch = s.name.toLowerCase().includes(search);
        // เช็กว่าเลือก 'all' อยู่ หรือไอคอนตรงกับหนึ่งในหมวดหมู่ที่ถูกเลือกไว้หรือไม่
        const matchesCategory = selectedCategories.has('all') || selectedCategories.has(s.icon);
        return matchesSearch && matchesCategory;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
            <i class="fa-solid fa-folder-open text-3xl mb-2"></i>
            <p class="text-sm">ไม่พบทางลัดเว็บไซต์</p>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map(s => `
        <div class="relative group bg-white p-4 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col items-center text-center ${isDeleteMode ? 'shake' : ''}">
          
          ${isDeleteMode ? `
            <button onclick="deleteShortcut('${s.id}')" class="absolute -top-2 -right-2 bg-rose-600 text-white w-7 h-7 rounded-full shadow-md hover:bg-rose-700 transition flex items-center justify-center z-10">
              <i class="fa-solid fa-xmark text-xs"></i>
            </button>
          ` : ''}

          <a href="${s.url}" target="_blank" class="w-full flex flex-col items-center">
            <div class="w-12 h-12 rounded-xl bg-rose-50 text-rose-900 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition">
              <i class="fa-solid ${s.icon}"></i>
            </div>
            <span class="font-semibold text-xs text-slate-700 truncate w-full">${s.name}</span>
          </a>
        </div>
      `).join('');
    }

    function addShortcut(e) {
      e.preventDefault();
      const name = document.getElementById('shortcutName').value.trim();
      let url = document.getElementById('shortcutUrl').value.trim();
      const icon = document.getElementById('shortcutIcon').value;

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      const newShortcut = {
        id: Date.now().toString(),
        name,
        url,
        icon
      };

      shortcuts.push(newShortcut);
      saveToLocalStorage();
      renderShortcuts();
      closeModal();

      document.getElementById('shortcutName').value = '';
      document.getElementById('shortcutUrl').value = '';
    }

    function deleteShortcut(id) {
      shortcuts = shortcuts.filter(s => s.id !== id);
      saveToLocalStorage(); 
      renderShortcuts();
    }

    function toggleDeleteMode() {
      isDeleteMode = !isDeleteMode;
      const btnText = document.getElementById('deleteBtnText');
      const toggleBtn = document.getElementById('deleteToggleBtn');

      if (isDeleteMode) {
        btnText.innerText = 'เสร็จสิ้น';
        toggleBtn.className = 'px-3 py-2 rounded-xl bg-amber-500 text-white text-xs font-bold shadow transition flex items-center gap-1.5';
      } else {
        btnText.innerText = 'โหมดลบเว็บ';
        toggleBtn.className = 'px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold border border-slate-300 transition flex items-center gap-1.5';
      }
      renderShortcuts();
    }

    function openModal() { document.getElementById('addModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('addModal').classList.add('hidden'); }

    loadShortcuts();
  </script>
</body>
</html>
