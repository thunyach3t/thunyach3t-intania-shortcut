<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Intania Shortcut</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
    .shake { animation: shake 0.3s infinite alternate; }
    @keyframes shake { 0% { transform: rotate(-1deg); } 100% { transform: rotate(1deg); } }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* สไตล์ช่องเดิมขณะลากย้าย (ให้จางลงเพื่อให้เห็นช่องว่างชัดเจน) */
    .dragging-card {
      opacity: 0.25 !important;
      border: 2px dashed #cbd5e1 !important;
    }
  </style>
  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#881337">

  <!-- สำหรับ iOS (Safari) ให้รองรับการทำงานแบบ Web App Fullscreen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Intania">
  <link rel="apple-touch-icon" href="https://www.intania.com/wp-content/uploads/2024/06/cropped-intania_logo.jpg">
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- Header Bar with Real Chula Engineering Logo Image -->
  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-4">
      
      <!-- Logo Section -->
      <div class="flex items-center">
        <img src="https://reg.eng.chula.ac.th/reg/wp-content/uploads/2018/05/cropped-cu-eng-logo.png" alt="Chula Engineering Logo" class="h-10 sm:h-12 w-auto object-contain">
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
        <!-- ปุ่มรีเซ็ตค่าเริ่มต้น -->
        <button onclick="openResetModal()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold border border-slate-300 transition flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-left"></i>
          <span>รีเซ็ต</span>
        </button>

        <button onclick="toggleDeleteMode()" id="deleteToggleBtn" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold border border-slate-300 transition flex items-center gap-1.5">
          <i class="fa-solid fa-pen-to-square"></i>
          <span id="deleteBtnText">จัดลำดับ / ลบทางลัด</span>
        </button>

        <button onclick="openModal()" class="px-4 py-2 rounded-xl bg-rose-900 hover:bg-rose-950 text-white text-xs font-bold shadow transition flex items-center gap-1.5">
          <i class="fa-solid fa-plus"></i>
          <span>เพิ่มทางลัด</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow space-y-6">

    <div id="storageWarning" class="hidden bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-xl text-xs flex items-center gap-2">
      <i class="fa-solid fa-triangle-exclamation text-amber-600"></i>
      <span>คำเตือน: เบราว์เซอร์ของคุณบล็อกการบันทึกข้อมูลถาวร (LocalStorage) กรุณาออกจากโหมดส่วนตัว (Incognito)</span>
    </div>

    <!-- Search Bar & View Toggle Button Container -->
    <div class="flex items-center gap-2">
      <div class="relative flex-grow">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" oninput="renderShortcuts()" placeholder="ค้นหาทางลัดเว็บไซต์..." 
               class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-rose-800 text-sm transition">
      </div>

      <button onclick="toggleViewMode()" id="viewToggleBtn" title="สลับการแสดงผลข้อความปุ่มหมวดหมู่" 
              class="px-4 py-3 bg-white border border-slate-200 text-slate-700 rounded-2xl shadow-sm hover:bg-slate-50 transition flex items-center gap-1.5 text-xs font-medium whitespace-nowrap">
        <i class="fa-solid fa-text-slash text-sm"></i>
        <span class="hidden sm:inline" id="viewToggleText">ซ่อนข้อความ</span>
      </button>
    </div>

    <!-- Category Slider Container -->
    <div class="relative flex items-center">
      <button id="scrollLeftBtn" onclick="slideCategories(-200)" class="absolute left-0 z-10 bg-white/95 hover:bg-white text-slate-700 shadow-md border border-slate-200 w-8 h-8 rounded-full flex items-center justify-center -ml-3 transition hidden">
        <i class="fa-solid fa-chevron-left text-xs"></i>
      </button>

      <div id="categorySlider" onscroll="checkScrollPosition()" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-2 px-2 w-full scroll-smooth">
        <button data-cat="all" onclick="toggleCategory('all')" class="cat-btn flex-shrink-0 bg-slate-800 text-white px-4 py-2 rounded-full text-xs font-medium transition shadow-sm hover:opacity-95 flex items-center gap-1.5">
          <span>🌟</span> <span class="cat-label">ทั้งหมด</span>
        </button>
        <button data-cat="fa-graduation-cap" onclick="toggleCategory('fa-graduation-cap')" class="cat-btn flex-shrink-0 bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-medium transition shadow-sm hover:bg-slate-50 flex items-center gap-1.5">
          <span>🎓</span> <span class="cat-label">เว็บมหาลัย</span>
        </button>
        <button data-cat="fa-book" onclick="toggleCategory('fa-book')" class="cat-btn flex-shrink-0 bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-medium transition shadow-sm hover:bg-slate-50 flex items-center gap-1.5">
          <span>📚</span> <span class="cat-label">หนังสือ / ห้องสมุด</span>
        </button>
        <button data-cat="fa-envelope" onclick="toggleCategory('fa-envelope')" class="cat-btn flex-shrink-0 bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-medium transition shadow-sm hover:bg-slate-50 flex items-center gap-1.5">
          <span>✉️</span> <span class="cat-label">อีเมล / ติดต่อ</span>
        </button>
        <button data-cat="fa-laptop-code" onclick="toggleCategory('fa-laptop-code')" class="cat-btn flex-shrink-0 bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-medium transition shadow-sm hover:bg-slate-50 flex items-center gap-1.5">
          <span>💻</span> <span class="cat-label">ระบบการเรียน</span>
        </button>
        <button data-cat="fa-globe" onclick="toggleCategory('fa-globe')" class="cat-btn flex-shrink-0 bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-medium transition shadow-sm hover:bg-slate-50 flex items-center gap-1.5">
          <span>🌐</span> <span class="cat-label">เว็บทั่วไป</span>
        </button>
        <button data-cat="fa-gamepad" onclick="toggleCategory('fa-gamepad')" class="cat-btn flex-shrink-0 bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-medium transition shadow-sm hover:bg-slate-50 flex items-center gap-1.5">
          <span>🎮</span> <span class="cat-label">เว็บเกม</span>
        </button>
      </div>

      <button id="scrollRightBtn" onclick="slideCategories(200)" class="absolute right-0 z-10 bg-white/95 hover:bg-white text-slate-700 shadow-md border border-slate-200 w-8 h-8 rounded-full flex items-center justify-center -mr-3 transition">
        <i class="fa-solid fa-chevron-right text-xs"></i>
      </button>
    </div>

    <!-- Shortcuts Grid -->
    <div id="shortcutsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
      <!-- Shortcuts will be rendered here -->
    </div>

  </main>

  <!-- Add Shortcut Modal -->
  <div id="addModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
          <i class="fa-solid fa-link text-rose-800"></i> เพิ่มทางลัดใหม่
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form onsubmit="addShortcut(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อเว็บไซต์ / ระบบ</label>
          <input type="text" id="shortcutName" required placeholder="เช่น myCourseVille, Reg Chula" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-800">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">URL (ลิงก์เว็บไซต์)</label>
          <input type="url" id="shortcutUrl" required placeholder="https://www.example.com" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-800">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">เลือกไอคอน</label>
          <select id="shortcutIcon" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-800 bg-white">
            <option value="fa-graduation-cap">🎓 เว็บมหาลัย</option>
            <option value="fa-book">📚 หนังสือ / ห้องสมุด</option>
            <option value="fa-envelope">✉️ อีเมล / ติดต่อ</option>
            <option value="fa-laptop-code">💻 ระบบการเรียน</option>
            <option value="fa-globe">🌐 เว็บทั่วไป</option>
            <option value="fa-gamepad">🎮 เว็บเกม</option>
          </select>
        </div>

        <button type="submit" class="w-full py-2.5 bg-rose-900 text-white font-semibold rounded-xl hover:bg-rose-950 transition text-sm shadow">
          บันทึกทางลัด
        </button>
      </form>
    </div>
  </div>

  <!-- Reset Confirmation Modal -->
  <div id="resetModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl relative space-y-4 text-center">
      <div class="w-12 h-12 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center text-xl mx-auto">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <div class="space-y-1">
        <h3 class="font-bold text-slate-800 text-base">ยืนยันรีเซ็ตค่าเริ่มต้น?</h3>
        <p class="text-xs text-slate-500">ทางลัดทั้งหมดจะถูกรีเซ็ตกลับเป็นค่าเริ่มต้น 4 อันแรก</p>
      </div>

      <div class="flex gap-2 pt-2">
        <!-- ปุ่มยกเลิกเด่นกว่า (สีทึบ) -->
        <button onclick="closeResetModal()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl transition text-xs shadow">
          ยกเลิก
        </button>
        <!-- ปุ่มยืนยันรีเซ็ต -->
        <button onclick="confirmReset()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-rose-700 font-semibold border border-slate-300 rounded-xl transition text-xs">
          ยืนยันรีเซ็ต
        </button>
      </div>
    </div>
  </div>

  <footer class="text-center py-4 text-xs text-slate-400 border-t bg-white mt-8">
    Intania Shortcut &copy; INTANIA 110 No.280
  </footer>

  <script>
    const defaultPresets = [
      { id: '1', name: 'Reg Chula', url: 'https://www.reg.chula.ac.th', icon: 'fa-graduation-cap' },
      { id: '2', name: 'myCourseVille', url: 'https://www.mycourseville.com', icon: 'fa-laptop-code' },
      { id: '3', name: 'Office 365', url: 'https://www.office.com', icon: 'fa-envelope' },
      { id: '4', name: 'GPA Calculator', url: 'https://sites.google.com/view/thunyach3t-intania-gpa', icon: 'fa-globe' }
    ];

    let shortcuts = [];
    let isDeleteMode = false;
    let selectedCategories = new Set(['all']);
    let isIconOnly = false;
    let draggedId = null;

    function checkScrollPosition() {
      const slider = document.getElementById('categorySlider');
      const leftBtn = document.getElementById('scrollLeftBtn');
      const rightBtn = document.getElementById('scrollRightBtn');

      if (!slider) return;

      if (slider.scrollLeft > 5) {
        leftBtn.classList.remove('hidden');
      } else {
        leftBtn.classList.add('hidden');
      }

      const maxScrollLeft = slider.scrollWidth - slider.clientWidth - 5;
      if (slider.scrollLeft < maxScrollLeft) {
        rightBtn.classList.remove('hidden');
      } else {
        rightBtn.classList.add('hidden');
      }
    }

    function slideCategories(offset) {
      const slider = document.getElementById('categorySlider');
      slider.scrollBy({ left: offset, behavior: 'smooth' });
    }

    function toggleViewMode() {
      isIconOnly = !isIconOnly;
      const labels = document.querySelectorAll('.cat-label');
      const toggleText = document.getElementById('viewToggleText');
      const toggleBtnIcon = document.querySelector('#viewToggleBtn i');

      labels.forEach(lbl => {
        if (isIconOnly) {
          lbl.classList.add('hidden');
        } else {
          lbl.classList.remove('hidden');
        }
      });

      if (isIconOnly) {
        toggleText.innerText = 'แสดงข้อความ';
        toggleBtnIcon.className = 'fa-solid fa-text-height text-sm';
      } else {
        toggleText.innerText = 'ซ่อนข้อความ';
        toggleBtnIcon.className = 'fa-solid fa-text-slash text-sm';
      }

      setTimeout(checkScrollPosition, 100);
    }

    function toggleCategory(category) {
      if (category === 'all') {
        selectedCategories.clear();
        selectedCategories.add('all');
      } else {
        selectedCategories.delete('all');
        if (selectedCategories.has(category)) {
          selectedCategories.delete(category);
        } else {
          selectedCategories.add(category);
        }
        if (selectedCategories.size === 0) {
          selectedCategories.add('all');
        }
      }

      updateCategoryButtonsUI();
      renderShortcuts();
    }

    function updateCategoryButtonsUI() {
      const buttons = document.querySelectorAll('.cat-btn');
      buttons.forEach(btn => {
        const cat = btn.getAttribute('data-cat');
        if (selectedCategories.has(cat)) {
          btn.className = 'cat-btn flex-shrink-0 bg-slate-800 text-white px-4 py-2 rounded-full text-xs font-medium transition shadow-sm hover:opacity-95 flex items-center gap-1.5';
        } else {
          btn.className = 'cat-btn flex-shrink-0 bg-white text-slate-600 border border-slate-200 px-4 py-2 rounded-full text-xs font-medium transition shadow-sm hover:bg-slate-50 flex items-center gap-1.5';
        }
      });
    }

    function loadShortcuts() {
      try {
        const savedData = localStorage.getItem('intania_shortcuts_v1');
        if (savedData !== null) {
          shortcuts = JSON.parse(savedData);
        } else {
          shortcuts = [...defaultPresets];
          saveToLocalStorage();
        }
      } catch (e) {
        console.warn('LocalStorage error:', e);
        document.getElementById('storageWarning').classList.remove('hidden');
        shortcuts = [...defaultPresets];
      }
      renderShortcuts();
      setTimeout(checkScrollPosition, 100);
    }

    function saveToLocalStorage() {
      try {
        localStorage.setItem('intania_shortcuts_v1', JSON.stringify(shortcuts));
      } catch (e) {
        console.warn('Cannot save to LocalStorage:', e);
        document.getElementById('storageWarning').classList.remove('hidden');
      }
    }

    function renderShortcuts() {
      const grid = document.getElementById('shortcutsGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = shortcuts.filter(s => {
        const matchesSearch = s.name.toLowerCase().includes(search);
        const matchesCategory = selectedCategories.has('all') || selectedCategories.has(s.icon);
        return matchesSearch && matchesCategory;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
            <i class="fa-solid fa-folder-open text-3xl mb-2"></i>
            <p class="text-sm">ไม่พบทางลัดเว็บไซต์</p>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map(s => `
        <div class="relative group bg-white p-4 rounded-2xl border border-slate-200 shadow-sm transition flex flex-col items-center text-center ${isDeleteMode ? 'shake cursor-grab active:cursor-grabbing select-none' : 'hover:shadow-md'}"
             draggable="${isDeleteMode ? 'true' : 'false'}"
             ondragstart="${isDeleteMode ? `onDragStart(event, '${s.id}')` : 'return false;'}"
             ondragend="onDragEnd(event)"
             ondragover="${isDeleteMode ? 'onDragOver(event)' : ''}"
             ondrop="${isDeleteMode ? `onDrop(event, '${s.id}')` : ''}"
             onclick="${isDeleteMode ? 'event.preventDefault();' : `window.open('${s.url}', '_blank');`}">
          
          ${isDeleteMode ? `
            <button onclick="event.stopPropagation(); deleteShortcut('${s.id}')" class="absolute -top-2 -right-2 bg-rose-600 text-white w-7 h-7 rounded-full shadow-md hover:bg-rose-700 transition flex items-center justify-center z-10">
              <i class="fa-solid fa-xmark text-xs"></i>
            </button>
            <div class="absolute top-2 left-2 text-slate-300 text-xs">
              <i class="fa-solid fa-grip-dots-vertical"></i>
            </div>
          ` : ''}

          <div class="w-full flex flex-col items-center pointer-events-none">
            <div class="w-12 h-12 rounded-xl bg-rose-50 text-rose-900 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition">
              <i class="fa-solid ${s.icon}"></i>
            </div>
            <span class="font-semibold text-xs text-slate-700 truncate w-full">${s.name}</span>
          </div>
        </div>
      `).join('');
    }

    // --- ระบบ Drag & Drop เต็มพื้นที่การ์ด ---
    function onDragStart(e, id) {
      if (!isDeleteMode) {
        e.preventDefault();
        return;
      }
      draggedId = id;
      e.dataTransfer.effectAllowed = 'move';
      
      const target = e.currentTarget;
      setTimeout(() => {
        target.classList.add('dragging-card');
      }, 0);
    }

    function onDragEnd(e) {
      e.currentTarget.classList.remove('dragging-card');
      draggedId = null;
    }

    function onDragOver(e) {
      if (!isDeleteMode) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function onDrop(e, targetId) {
      if (!isDeleteMode) return;
      e.preventDefault();
      if (draggedId === targetId) return;

      const oldIndex = shortcuts.findIndex(s => s.id === draggedId);
      const newIndex = shortcuts.findIndex(s => s.id === targetId);

      if (oldIndex !== -1 && newIndex !== -1) {
        const movedItem = shortcuts.splice(oldIndex, 1)[0];
        shortcuts.splice(newIndex, 0, movedItem);

        saveToLocalStorage();
        renderShortcuts();
      }
    }

    function addShortcut(e) {
      e.preventDefault();
      const name = document.getElementById('shortcutName').value.trim();
      let url = document.getElementById('shortcutUrl').value.trim();
      const icon = document.getElementById('shortcutIcon').value;

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      const newShortcut = {
        id: Date.now().toString(),
        name,
        url,
        icon
      };

      shortcuts.push(newShortcut);
      saveToLocalStorage();
      renderShortcuts();
      closeModal();

      document.getElementById('shortcutName').value = '';
      document.getElementById('shortcutUrl').value = '';
      setTimeout(checkScrollPosition, 100);
    }

    function deleteShortcut(id) {
      shortcuts = shortcuts.filter(s => s.id !== id);
      saveToLocalStorage(); 
      renderShortcuts();
      setTimeout(checkScrollPosition, 100);
    }

    // ฟังก์ชันจัดการปุ่มรีเซ็ต
    function openResetModal() {
      document.getElementById('resetModal').classList.remove('hidden');
    }
    function closeResetModal() {
      document.getElementById('resetModal').classList.add('hidden');
    }
    function confirmReset() {
      shortcuts = [...defaultPresets];
      saveToLocalStorage();
      renderShortcuts();
      closeResetModal();
      setTimeout(checkScrollPosition, 100);
    }

    function toggleDeleteMode() {
      isDeleteMode = !isDeleteMode;
      const btnText = document.getElementById('deleteBtnText');
      const toggleBtn = document.getElementById('deleteToggleBtn');

      if (isDeleteMode) {
        btnText.innerText = 'เสร็จสิ้น (บันทึก)';
        toggleBtn.className = 'px-3 py-2 rounded-xl bg-amber-500 text-white text-xs font-bold shadow transition flex items-center gap-1.5';
      } else {
        btnText.innerText = 'จัดลำดับ / ลบทางลัด';
        toggleBtn.className = 'px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold border border-slate-300 transition flex items-center gap-1.5';
      }
      renderShortcuts();
    }

    function openModal() { document.getElementById('addModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('addModal').classList.add('hidden'); }

    loadShortcuts();
    window.addEventListener('resize', checkScrollPosition);
  </script>
</body>
</html>
